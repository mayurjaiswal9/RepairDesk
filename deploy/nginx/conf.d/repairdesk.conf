# RepairDesk — Nginx site config (REL-001).
# Replace YOUR_DOMAIN with your actual domain name.

server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # Modern TLS only
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy  "strict-origin-when-cross-origin" always;

    # Proxy to Spring Boot API
    location /api/ {
        proxy_pass         http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        # Attachment uploads can be large
        client_max_body_size 30M;
        proxy_read_timeout   120s;
    }

    # Proxy to Swagger UI
    location /swagger-ui/ {
        proxy_pass http://api:8080/swagger-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://api:8080/v3/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Actuator health (for load balancers — expose minimally)
    location /actuator/health {
        proxy_pass http://api:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        allow all;
    }

    # Block everything else at nginx level
    location / {
        return 404;
    }
}
