spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: test-secret-must-be-at-least-32-bytes-long-here
  storage:
    location: ./build/test-storage
  security:
    password-min-length: 8
  cors:
    allowed-origins: http://localhost:3000
  admin:
    default-username: admin
    default-password: Admin@1234
    default-mobile: "0000000000"
